name: CI

# Run on every push to main and on every pull request targeting main.
# This catches broken code BEFORE it reaches Render's auto-deploy, or
# before a PR gets merged.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest

  docker-build:
    runs-on: ubuntu-latest
    # Only bother building the image if tests already passed - no point
    # spending build minutes on code we already know is broken.
    needs: test

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t exoplanet-api:ci-test .

      - name: Smoke-test the container
        run: |
          docker run -d -p 8000:8000 --name test-container exoplanet-api:ci-test
          sleep 5
          curl --fail http://localhost:8000/health
          docker stop test-container